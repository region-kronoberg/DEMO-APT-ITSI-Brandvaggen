<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000a16">
  <title>Brandväggen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="label">Poäng</div>
      <div id="score" class="value">0</div>
      <div id="mult" class="mult"></div>
    </div>
    <div class="hud-center">
      <div class="label">Våg</div>
      <div id="wave" class="value">1</div>
    </div>
    <div class="hud-right">
      <div class="label">Nätverkets integritet</div>
      <div class="bar"><div id="integrity"></div></div>
    </div>
    <div id="pulse" class="pulse"><span>PULS</span><div class="pulse-fill" id="pulseFill"></div></div>
    <div id="buffs" class="buffs"></div>
  </div>

  <div id="banner" class="banner"></div>

  <section id="start" class="screen">
    <div class="panel">
      <div class="kicker" id="team"></div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
      <div class="howto">
        <div><b>Styr brandväggen</b> med musen, fingret eller piltangenterna</div>
        <div><b>Puls</b> med mellanslag eller dubbeltryck, rensar närliggande hot</div>
        <div><b>Fånga</b> MFA, Patch och Backup för förstärkning</div>
      </div>
      <div class="threats" id="threatList"></div>
      <button id="play" class="btn">Starta försvaret</button>
      <div id="qrWrap" class="qr hidden"><div id="qr"></div><span>Spela i mobilen</span></div>
    </div>
  </section>

  <section id="over" class="screen hidden">
    <div class="panel">
      <div class="kicker">Nätverket föll</div>
      <h1>Incident</h1>
      <div class="final"><span id="finalScore">0</span><small>poäng</small></div>
      <p class="sub" id="finalInfo"></p>
      <p class="best" id="best"></p>
      <button id="again" class="btn">Försök igen</button>
    </div>
  </section>

  <div id="build" class="build"></div>
  <button id="mute" class="mute" aria-label="Ljud av eller på">♪</button>

  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
